<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城南市</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft Yahei",sans-serif;
}
body{
    background-color:#f1f2f3;
    padding:40px 30px;
}

.top-card{
    background:#fff;
    border-radius:16px;
    padding:32px;
    max-width:1000px;
    margin:0 auto 24px;
}
.top-card h1{
    font-size:32px;
    color:#222;
    margin-bottom:6px;
}
.top-card .sub-title{
    color:#555;
    font-size:18px;
    margin-bottom:22px;
}
.info-line{
    font-size:17px;
    color:#333;
    margin-bottom:12px;
    line-height:1.6;
}
.related-search{
    margin-top:20px;
}
.related-search span{
    display:inline-block;
    background:#eee;
    padding:6px 14px;
    border-radius:8px;
    font-size:16px;
    margin-right:10px;
    cursor:pointer;
}

.news-wrap{
    max-width:1000px;
    margin:0 auto;
    background:#fff;
    border-radius:16px;
    padding:24px;
}
.news-item{
    padding:18px 12px;
    border-bottom:1px solid #efefef;
    cursor:pointer;
}
.news-item:last-child{
    border-bottom:none;
}
.news-item:hover{
    background:#f7f8f9;
}
.news-title{
    font-size:19px;
    display:flex;
    justify-content:space-between;
    margin-bottom:6px;
}
.news-desc{
    font-size:16px;
    color:#555;
    padding-left:22px;
    line-height:1.6;
}
.blue-dot{
    color:#3678d9;
}
.green-dot{
    color:#28a745;
}

.btn-back{
    position:fixed;
    bottom:28px;
    right:28px;
    padding:10px 18px;
    border:1px solid #b9c8dd;
    background:#e8f0fb;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}
</style>
</head>
<body>

<div class="top-card">
    <h1>城南市</h1>
    <div class="sub-title">艺术之城</div>
    <div class="info-line">成立日期：1987年9月21日</div>
    <div class="info-line">城市特色：海上图书馆、文艺街区、手工涂鸦</div>
    <div class="info-line">行政管理：城南市政府、城南市社会保障局</div>
    <div class="related-search">
        <span>城南市钢琴比赛</span>
        <span>城南老艺术街区</span>
        <span>城南市艺术博览会</span>
    </div>
</div>

<div class="news-wrap">
    <div class="news-item" onclick="location.href='city-info.html'">
        <div class="news-title">
            <span><span class="blue-dot">●</span> 城南市 - 城市档案</span>
            <span style="color:#777;font-size:15px">chengnan-city.gov</span>
        </div>
        <div class="news-desc">城南市成立于1987年9月21日，以艺术闻名，是很多艺术家的故乡。</div>
    </div>

    <div class="news-item" onclick="location.href='piano.html'">
        <div class="news-title">
            <span><span class="green-dot">●</span> 城南市钢琴比赛 | 官方赛事信息</span>
            <span style="color:#777;font-size:15px">chengnan-piano.org</span>
        </div>
        <div class="news-desc">第29届城南市全国钢琴大赛已开启报名，设置青年原创曲目赛道。</div>
    </div>

    <div class="news-item">
        <div class="news-title">
            <span><span class="blue-dot">●</span> 城南市政府发布城市经济发展报告</span>
            <span style="color:#777;font-size:15px">chengnan-city.gov</span>
        </div>
        <div class="news-desc">报告显示，城南市经济正在迅速发展，近两年涨幅很大。</div>
    </div>
</div>

<button class="btn-back" onclick="location.href='testimony.html'">返回搜索界面</button>

</body>
</html>
