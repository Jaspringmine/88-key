<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信聊天详情</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft Yahei",sans-serif;
}

body{
    background:#111;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
}

/* 手机外框 */
.phone-frame{
    width:420px;
    height:860px;
    background:#000;
    border-radius:44px;
    padding:12px;
    box-shadow:0 0 30px rgba(0,0,0,0.6);
    position:relative;
}

/* 刘海 */
.phone-frame::before{
    content:"";
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    width:110px;
    height:22px;
    background:#000;
    border-radius:20px;
    z-index:20;
}

/* 手机屏幕 */
.phone-screen{
    width:100%;
    height:100%;
    background:#ededed;
    border-radius:36px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* 顶部状态栏 */
.status-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 28px 6px;
    font-size:15px;
    color:#000;
    background:#f7f7f7;
}

/* 聊天顶部栏 */
.chat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px 14px;
    background:#f7f7f7;
    color:#000;
    border-bottom:1px solid #ececec;
}

.chat-header .back{
    font-size:20px;
    cursor:pointer;
    color:#333;
    text-decoration: none;
}

.chat-header .name{
    font-size:17px;
    font-weight:bold;
}

.chat-header .menu{
    font-size:20px;
    color:#333;
}

/* 聊天内容区 */
.chat-content{
    flex:1;
    overflow-y:auto;
    padding:16px 12px;
    background:#f0f0f0;
}

/* 日期提示 */
.date-tip{
    text-align:center;
    color:#999;
    font-size:12px;
    margin:20px 0;
}

/* 气泡通用 【重点新增 text-align:left】 */
.bubble{
    display:inline-block;
    max-width:72%;
    width:auto;
    padding:10px 14px;
    border-radius:10px;
    font-size:15px;
    line-height:1.5;
    word-wrap:break-word;
    white-space:normal;
    position:relative;
    margin-bottom:14px;
    text-align:left;
}

/* 对方消息 */
.other{
    background:#ffffff;
    color:#000;
    border:1px solid #e5e5e5;
}

/* 自己消息 */
.self{
    background:#95ec69;
    color:#000;
}

/* 让自己的消息整行右对齐 */
.self-row{
    text-align:right;
}

/* 底部输入区 */
.input-area{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px 14px;
    background:#ffffff;
    border-top:1px solid #ececec;
}

.input-area input{
    flex:1;
    height:40px;
    border-radius:20px;
    border:1px solid #ddd;
    padding:0 14px;
    outline:none;
    font-size:15px;
    background:#f7f7f7;
}

.input-area .icon{
    font-size:22px;
    color:#666;
    width:36px;
    text-align:center;
}
</style>
</head>
<body>

<div class="phone-frame">
    <div class="phone-screen">

        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <span> </span>
            <span>▧▧▧ ⌂ 58</span>
        </div>
        <!-- 聊天顶部栏 -->
        <div class="chat-header">
            <a href="phone1.html" class="back">‹</a>
            <span class="name">管家</span>
            <span class="menu">⋯</span>
        </div>
        <!-- 聊天内容 -->
        <div class="chat-content">
            <div class="date-tip">一周前</div>

            <div class="self-row">
                <div class="bubble self">
                    今天早上出门我看到小湄手上很多淤青，怎么弄的?
                </div>
            </div>

            <div class="bubble other">
                少爷，这个我也不是很清楚。
            </div>
            <div class="bubble other">
                小姐之前就有过类似的情况，但她不愿意说，我们这些做下人的也不方便问。
            </div>

            <div class="self-row">
                <div class="bubble self">
                    马上去查！
                </div>
            </div>

            <div class="bubble other">
                好的，少爷。
            </div>

            <div class="date-tip">三天前</div>

            <div class="bubble other">
                抱歉少爷，这几天我除了琴房没去，其他时候我都跟着小姐的，可还是没发现淤青是怎么弄出来的。
            </div>

            <div class="self-row">
                <div class="bubble self">
                    这点事都做不好?
                </div>
            </div>
        </div>

        <!-- 底部输入框 -->
        <div class="input-area">
            <span class="icon">⌨</span>
            <input type="text" placeholder="输入消息">
            <span class="icon">☰</span>
        </div>

    </div>
</div>

</body>
</html>
