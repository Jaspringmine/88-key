<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机微信</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft Yahei",sans-serif;
}

body{
    background:#111;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
}

/* 手机外框：像截图一样居中竖屏展示 */
.phone-frame{
    width:420px;
    height:860px;
    background:#000;
    border-radius:44px;
    padding:12px;
    box-shadow:0 0 30px rgba(0,0,0,0.6);
    position:relative;
}

/* 刘海 */
.phone-frame::before{
    content:"";
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    width:110px;
    height:22px;
    background:#000;
    border-radius:20px;
    z-index:20;
}

/* 微信手机屏幕 */
.phone-screen{
    width:100%;
    height:100%;
    background:#f7f7f7;
    border-radius:36px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* 顶部状态栏 */
.status-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 28px 6px;
    font-size:15px;
    color:#000;
    background:#f7f7f7;
}

/* 微信标题栏 */
.wechat-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 18px 14px;
    background:#f7f7f7;
    color:#000;
}
.wechat-header .title{
    font-size:21px;
    font-weight:bold;
}
.wechat-header .icon{
    font-size:22px;
    color:#333;
}

/* 搜索框 */
.search-box{
    margin:0 14px 12px;
    background:#ffffff;
    border-radius:8px;
    padding:9px 12px;
    color:#999;
    font-size:14px;
    border:1px solid #ececec;
    display:flex;
    align-items:center;
    gap:8px;
}

/* 会话列表区域 */
.chat-list{
    flex:1;
    overflow-y:auto;
    background:#ffffff;
}

/* 单条聊天框 */
.chat-item{
    display:flex;
    align-items:center;
    padding:14px 16px;
    gap:14px;
    border-bottom:1px solid #f2f2f2;
    cursor:pointer;
    text-decoration:none;
}
.chat-item:hover{
    background:#fafafa;
}
.chat-item:active{
    background:#f0f0f0;
}

/* 头像 */
.avatar{
    width:48px;
    height:48px;
    border-radius:6px;
    background:#ddd;
    flex-shrink:0;
    object-fit:cover;
}

/* 右侧文字信息 */
.chat-info{
    flex:1;
    min-width:0;
}

.chat-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:4px;
}

.chat-name{
    font-size:16px;
    color:#000;
    font-weight:500;
}

.chat-time{
    font-size:12px;
    color:#999;
}

.chat-preview{
    font-size:14px;
    color:#666;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* 底部导航 */
.bottom-nav{
    display:flex;
    justify-content:space-around;
    padding:10px 0 14px;
    background:#ffffff;
    border-top:1px solid #f2f2f2;
}

.nav-item{
    text-align:center;
    color:#666;
    font-size:12px;
}

.nav-item.active{
    color:#07c160;
}

.nav-icon{
    font-size:20px;
    margin-bottom:2px;
}

/* 返回按钮，放在手机外部页面底部 */
.back-out{
    position:absolute;
    bottom:30px;
    left:0;
    right:0;
    text-align:center;
}

.back-out a{
    color:#ccc;
    font-size:14px;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="phone-frame">
    <div class="phone-screen">

        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <span>09:32</span>
            <span>▧▧▧ ⌂ 76</span>
        </div>

        <!-- 微信标题栏 -->
        <div class="wechat-header">
            <span class="icon">☆</span>
            <span class="title">微信</span>
            <span class="icon">+</span>
        </div>

        <!-- 搜索框 -->
        <div class="search-box">
            <span>○</span>
            <span>搜索</span>
        </div>

        <!-- 聊天列表：只保留3个聊天框 -->
        <div class="chat-list">

            <a class="chat-item" href="zhuli.html">
                <img class="avatar" src="images/助理.png" alt="头像">
                <div class="chat-info">
                    <div class="chat-top">
                        <span class="chat-name">助理</span>
                        <span class="chat-time">三天前</span>
                    </div>
                    <div class="chat-preview">收到老大，我这就去。</div>
                </div>
            </a>

            <a class="chat-item" href="xiemei.html">
                <img class="avatar" src="images/谢湄.png" alt="头像">
                <div class="chat-info">
                    <div class="chat-top">
                        <span class="chat-name">谢湄</span>
                        <span class="chat-time">三天前</span>
                    </div>
                    <div class="chat-preview">什么时候有空？</div>
                </div>
            </a>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <div class="nav-icon">●</div>
                <div>微信</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">♟</div>
                <div>通讯录</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">◇</div>
                <div>朋友圈</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">♧</div>
                <div>我</div>
            </div>
        </div>

    </div>
</div>

<!-- 返回按钮 -->
<div class="back-out">
    <a href="jinruchat.html">← 返回物证手机列表</a>
</div>

</body>
</html>
