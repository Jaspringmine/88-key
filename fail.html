<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八十八键证词 - 推论错误</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft Yahei",sans-serif;
}
body{
    background-color:#222222;
    min-height:100vh;
    padding:60px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#fff;
}
.result-card{
    width:820px;
    background:#ffffff;
    border-radius:12px;
    padding:40px 48px;
    color:#222;
}
h1{
    text-align:center;
    color:#8b2323;
    margin-bottom:30px;
}
.content-area{
    min-height:280px;
    line-height:1.8;
    font-size:17px;
    margin-bottom:36px;
    /* 可编辑文字区域 */
}
.back-btn{
    width:100%;
    height:48px;
    background:#8b2323;
    color:#fff;
    border:none;
    border-radius:24px;
    font-size:17px;
    cursor:pointer;
}
.back-btn:hover{
    background:#6b1b1b;
}
</style>
</head>
<body>
    <div class="result-card">
        <h1>推论出现重大偏差</h1>
        <!-- ========== 【可编辑文字区域】你直接修改这里面的文字 ========== -->
        <div class="content-area">
            侦探，当前推论与案件事实不符。<br><br>
            凶手的身份、作案的缘由还有隐藏的细节都没有被挖掘出来。<br><br>
            回到案件，重新翻阅所有物证、人物档案、手机线索，或许会有新的发现。<br><br>
            八十八个琴键所隐藏的证词等待你去解读。<br><br>
            感谢您的参与！

        </div>
        <!-- ======================================================== -->
        <button class="back-btn" onclick="window.location.href='index.html'">返回首页</button>
    </div>
</body>
</html>
