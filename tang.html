        <h1>画家唐堂成立个人画室，专注艺术创作</h1>
        <div class="news-meta">城南本地事儿 3月22日讯</div>

        <!-- 图片部分，把图片放到同文件夹，文件名改成tang.jpg -->
        <div class="img-box">
            <img src="images/tang.jpg" alt="唐堂">
        </div>
        <div class="img-caption">唐堂在个人画室中创作。</div>

        <div class="content">
            <p>本报讯 3月21日，城南本土知名画家唐堂的个人画室正式揭牌运营，为本地艺术创作交流再添一处新阵地。</p>
            <p>作为深耕城南艺术圈多年的创作者，唐堂长期聚焦本土风物题材创作，其作品多以城南街巷、山城旧景为核心元素，风格细腻鲜活，深受本地书画爱好者喜爱。对于此次个人画室的选址，他说，是思考了很长时间的结果，自己想在远离城市的地方多进行一些思考和创作。</p>
            <p>据了解，画室后续还将陆续推出本土青年画家作品联展、少儿公益美术课等系列活动，让艺术创作进一步融入城南居民的日常文化生活。</p>
